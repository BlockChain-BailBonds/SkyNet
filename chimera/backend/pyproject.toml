[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "918-chimera-lab"
version = "1.0.0"
description = "Live evidence-first GitHub repository capability fusion engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "networkx>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
chimera-lab = "chimera.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chimera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
