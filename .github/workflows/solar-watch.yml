name: SkyNet Solar Watch — independent NOAA sensor agents
on:
  push:
    branches: [main]
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate each sensor agent and training gate
        run: python -m unittest discover -s tests -p 'test_*agent*.py' -v
      - name: Fetch official NOAA Solar Watch source data
        run: python -m forecast.space_weather --allow-blocked
      - name: Produce public evidence report
        run: python -m sensor_agents.report
      - name: Upload evidence independent of GitHub Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skynet-solar-watch-evidence
          path: |
            data/public/space-weather.json
            data/public/sensor-agents.json
          if-no-files-found: warn
          retention-days: 7
