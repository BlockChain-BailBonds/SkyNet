name: Publish SkyNet Main to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: skynet-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify application
        run: |
          python -m unittest discover -s tests -v
          sha256sum -c MANIFEST.sha256
          node --check static/assets/spin.js
      - name: Prepare bounded public artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R static data agent docs _site/
          mkdir -p _site/chimera
          cp chimera/index.html _site/chimera/index.html
          touch _site/.nojekyll
          test -s _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: _site}
      - uses: actions/deploy-pages@v4
        id: deployment
