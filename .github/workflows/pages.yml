name: Publish SkyNet Main to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: skynet-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Verify application
        run: |
          python -m unittest discover -s tests -v
          sha256sum -c MANIFEST.sha256
          node --check static/assets/spin.js
      - name: Collect NOAA SWPC solar activity and shadow agent training
        run: python -m forecast.space_weather --allow-blocked
      - name: Collect read-only HAARP public diagnostics and antenna notices
        run: python -m forecast.haarp
      - name: Collect bounded read-only CERN public research metadata
        run: python -m forecast.cern --allow-blocked
      - name: Publish public sensor-agent input-output evidence
        run: python -m sensor_agents.report
      - name: Prepare bounded public artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R static data agent docs _site/
          mkdir -p _site/chimera
          cp chimera/index.html _site/chimera/index.html
          touch _site/.nojekyll
          test -s _site/index.html
      # Pages must first be enabled by a repository administrator in Settings → Pages.
      # GITHUB_TOKEN cannot create a Pages site (administration permission required).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: _site}
      - uses: actions/deploy-pages@v4
        id: deployment
