name: SkyNet Source Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test public CERN read-only collector (upstream outage allowed)
        if: matrix.python-version == '3.13'
        run: |
          python -m forecast.cern --allow-blocked
          python -c 'import json; from pathlib import Path; p=json.loads(Path("data/public/cern-status.json").read_text()); assert p["sources_checked"] == 6 and not p["direct_cern_sensor_access"]'
      - name: Save CERN source evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: cern-public-metadata-evidence
          path: data/public/cern-status.json
          retention-days: 7
      - name: Verify source manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Validate browser JavaScript syntax
        if: matrix.python-version == '3.13'
        run: node --check static/assets/spin.js && node --check static/assets/cern.js && node --check static/assets/codeforge.js
