name: Refresh bounded official snapshots
on:
  schedule: [{cron: '17 */2 * * *'}]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m forecast.ingest
      - name: Collect official station observations
        run: python -m forecast.environmental_sensors --allow-blocked
      - name: Collect NIFC operational wildfire incidents
        run: python -m forecast.firewatch --allow-blocked
      - run: python -m unittest tests.test_spin_mvp tests.test_environmental_sensors tests.test_firewatch -v
      - uses: actions/upload-artifact@v4
        with: {name: skynet-public-snapshots, path: 'data/public/*.json', retention-days: 7}
